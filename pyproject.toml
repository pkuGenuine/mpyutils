[project]
name = "mpyutils"
version = "0.1.0"
description = "Python decorators, Mixins, and various utility wrappers designed to simplify common programming patterns."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.13.2",
    "pydantic-settings>=2.12.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
